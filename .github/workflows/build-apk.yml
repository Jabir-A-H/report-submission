name: Build Android APK (TWA via Bubblewrap)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Website URL'
        required: false
        default: 'https://talimul-report.vercel.app'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          bubblewrap config set --key=jdkPath --value="$JAVA_HOME"
          bubblewrap config set --key=androidSdkPath --value="$ANDROID_HOME"

      - name: Configure Host URL
        run: |
          SITE_URL="${{ github.event.inputs.site_url || 'https://talimul-report.vercel.app' }}"
          HOST=$(echo "$SITE_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Configuring Bubblewrap host to $HOST"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.host = '$HOST';
            manifest.webManifestUrl = '$SITE_URL/manifest.webmanifest';
            manifest.iconUrl = '$SITE_URL/icons/icon-512.png';
            manifest.maskableIconUrl = '$SITE_URL/icons/icon-512.png';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'talimulreport' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'talimulreport' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret! Please add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p android-keystore
          node -e "
            const fs = require('fs');
            const raw = process.env.KEYSTORE_BASE64.replace(/\s+/g, '');
            fs.writeFileSync('android-keystore/release.keystore', Buffer.from(raw, 'base64'));
          "
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "BUBBLEWRAP_KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV

      - name: Verify Signing Fingerprint
        run: |
          echo "=== VERIFYING FINGERPRINT IN WORKFLOW ==="
          keytool -list -v -keystore android-keystore/release.keystore -alias "${{ secrets.KEY_ALIAS || 'talimul_report' }}" -storepass "${{ env.BUBBLEWRAP_KEYSTORE_PASSWORD }}"

      - name: Build Android APK with Bubblewrap
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Talimul-Quran-Report-Android
          path: |
            *.apk
            *.aab
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
