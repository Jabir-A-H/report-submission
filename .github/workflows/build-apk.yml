name: Build Android APK (TWA via Bubblewrap)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Website URL'
        required: false
        default: 'https://talimul-report.vercel.app'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Host URL
        run: |
          SITE_URL="${{ github.event.inputs.site_url || 'https://talimul-report.vercel.app' }}"
          HOST=$(echo "$SITE_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Configuring Bubblewrap host to $HOST"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.host = '$HOST';
            manifest.webManifestUrl = '$SITE_URL/manifest.webmanifest';
            manifest.iconUrl = '$SITE_URL/icons/icon-512.png';
            manifest.maskableIconUrl = '$SITE_URL/icons/icon-512.png';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Prepare Signing Keystore
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CUSTOM_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android-keystore
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "Using custom GitHub Secret release keystore..."
            echo "$CUSTOM_KEYSTORE_BASE64" | base64 --decode > android-keystore/release.keystore
            echo "KEYSTORE_PATH=$PWD/android-keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$CUSTOM_KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$CUSTOM_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$CUSTOM_KEY_PASS" >> $GITHUB_ENV
          else
            echo "Using default project release keystore (matching assetlinks.json SHA-256 fingerprint)..."
            cat << 'EOF' | base64 --decode > android-keystore/release.keystore
          
          EOF
            echo "KEYSTORE_PATH=$PWD/android-keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=talimulreport" >> $GITHUB_ENV
            echo "KEY_ALIAS=talimul_report" >> $GITHUB_ENV
            echo "KEY_PASSWORD=talimulreport" >> $GITHUB_ENV
          fi

          echo "=== VERIFYING FINGERPRINT IN WORKFLOW ==="
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "${KEY_ALIAS}" -storepass "${KEYSTORE_PASSWORD}" | grep -i "SHA256:"

      - name: Build Android APK with Bubblewrap
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signing.keyStorePath="$KEYSTORE_PATH" \
            --signing.keyStorePassword="$KEYSTORE_PASSWORD" \
            --signing.keyAlias="$KEY_ALIAS" \
            --signing.keyPassword="$KEY_PASSWORD"

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Talimul-Quran-Report-Android
          path: |
            *.apk
            *.aab
