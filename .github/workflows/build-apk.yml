name: Build Android APK (TWA via Bubblewrap)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Website URL'
        required: false
        default: 'https://talimul-report.vercel.app'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          # Bubblewrap expects legacy $ANDROID_HOME/tools/bin/sdkmanager or $ANDROID_HOME/bin/sdkmanager
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
            sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Configure Host URL
        run: |
          SITE_URL="${{ github.event.inputs.site_url || 'https://talimul-report.vercel.app' }}"
          HOST=$(echo "$SITE_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Configuring Bubblewrap host to $HOST"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.host = '$HOST';
            manifest.webManifestUrl = '$SITE_URL/manifest.webmanifest';
            manifest.iconUrl = '$SITE_URL/icons/icon-512.png';
            manifest.maskableIconUrl = '$SITE_URL/icons/icon-512.png';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'talimulreport' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'talimulreport' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret! Please add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p android-keystore
          node -e "
            const fs = require('fs');
            const raw = process.env.KEYSTORE_BASE64.replace(/\s+/g, '');
            fs.writeFileSync('android-keystore/release.keystore', Buffer.from(raw, 'base64'));
          "
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "BUBBLEWRAP_KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV

      - name: Verify Signing Fingerprint
        run: |
          echo "=== VERIFYING FINGERPRINT IN WORKFLOW ==="
          keytool -list -v -keystore android-keystore/release.keystore -alias "${{ secrets.KEY_ALIAS || 'talimul_report' }}" -storepass "${{ env.BUBBLEWRAP_KEYSTORE_PASSWORD }}"

      - name: Generate Android Project & Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          # 1. Start local manifest & icon server to eliminate external network dependencies during generation
          node -e "
            const http = require('http');
            const fs = require('fs');
            const path = require('path');
            const server = http.createServer((req, res) => {
              if (req.url === '/manifest.webmanifest') {
                res.writeHead(200, { 'Content-Type': 'application/manifest+json; charset=utf-8' });
                const manifest = {
                  name: \"তা'লীমুল কুরআন রিপোর্ট\",
                  short_name: \"তা'লীমুল কুরআন রিপোর্ট\",
                  description: \"Talimul Quran Report - সাংগঠনিক রিপোর্ট সাবমিশন ও মনিটরিং পোর্টাল\",
                  start_url: \"/home\",
                  display: \"standalone\",
                  orientation: \"portrait\",
                  background_color: \"#ffffff\",
                  theme_color: \"#0da2b8\",
                  icons: [
                    { src: \"/icons/icon-192.png\", sizes: \"192x192\", type: \"image/png\", purpose: \"maskable\" },
                    { src: \"/icons/icon-512.png\", sizes: \"512x512\", type: \"image/png\", purpose: \"maskable\" }
                  ]
                };
                res.end(JSON.stringify(manifest));
                return;
              }
              if (req.url.startsWith('/icons/')) {
                const file = path.join(process.cwd(), 'public', req.url);
                if (fs.existsSync(file)) {
                  res.writeHead(200, { 'Content-Type': 'image/png' });
                  fs.createReadStream(file).pipe(res);
                  return;
                }
              }
              res.writeHead(404);
              res.end('Not Found');
            });
            server.listen(8080, '127.0.0.1', () => console.log('Local manifest server ready on port 8080'));
          " &
          SERVER_PID=$!
          sleep 2

          # 2. Point twa-manifest.json to local endpoints for project generation
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.webManifestUrl = 'http://127.0.0.1:8080/manifest.webmanifest';
            m.iconUrl = 'http://127.0.0.1:8080/icons/icon-512.png';
            m.maskableIconUrl = 'http://127.0.0.1:8080/icons/icon-512.png';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

          # 3. Generate Android project structure non-interactively
          yes | bubblewrap update --skipVersionUpgrade

          # 4. Stop local server
          kill $SERVER_PID || true

          # 5. Restore production URLs in generated project and twa-manifest.json
          SITE_URL="${{ github.event.inputs.site_url || 'https://talimul-report.vercel.app' }}"
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i "s|http://127.0.0.1:8080/manifest.webmanifest|$SITE_URL/manifest.webmanifest|g" app/src/main/res/values/strings.xml
          fi

          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.webManifestUrl = '$SITE_URL/manifest.webmanifest';
            m.iconUrl = '$SITE_URL/icons/icon-512.png';
            m.maskableIconUrl = '$SITE_URL/icons/icon-512.png';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            const sum = crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex');
            fs.writeFileSync('manifest-checksum.txt', sum);
          "

          if [ -f manifest-checksum.txt ]; then
            echo "Manifest checksum synchronized: $(cat manifest-checksum.txt)"
          fi

          # 6. Build signed APK and App Bundle (non-interactive)
          yes | bubblewrap build

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Talimul-Quran-Report-Android
          path: |
            *.apk
            *.aab
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
